name: Build and release

# No checks on ordinary pushes to main. Pull requests run CI.
# Manual builds remain available, and version tags can build a release ZIP.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags: ['v*']
  workflow_dispatch:

# Cancel superseded PR runs to avoid a pile of failed/outdated checks.
concurrency:
  group: addon-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      filename: ${{ steps.version.outputs.filename }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Regression, Lua syntax and manifest gates
        run: bash scripts/run_ci.sh

      - name: Validate addon version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^## Version: *//p' NoQuestHintsForever/NoQuestHintsForever.toc | head -n 1 | tr -d '\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Invalid or missing addon version in TOC'
            exit 1
          fi
          release_version="$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v${version}(-(alpha|beta)(\.[0-9]+)?)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match TOC version v$version"
              exit 1
            fi
            release_version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "filename=NoQuestHintsForever-v$release_version.zip" >> "$GITHUB_OUTPUT"

      - name: Package and verify installable addon
        shell: bash
        env:
          FILENAME: ${{ steps.version.outputs.filename }}
        run: |
          set -euo pipefail
          python3 scripts/package_addon.py "dist/$FILENAME"

      # GitHub wraps artifacts in a ZIP itself. For test builds upload the
      # verified addon folder so the download is directly installable.
      - name: Prepare single-ZIP test download
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          FILENAME: ${{ steps.version.outputs.filename }}
        run: python3 -m zipfile -e "dist/$FILENAME" dist/installable

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: NoQuestHintsForever-v${{ steps.version.outputs.version }}
          path: dist/installable/
          if-no-files-found: error

      # Tagged releases still transfer the canonical ZIP to the release job.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: addon-${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: addon-${{ needs.build.outputs.version }}
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
