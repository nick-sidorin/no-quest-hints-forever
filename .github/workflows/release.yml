name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      filename: ${{ steps.version.outputs.filename }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Run tests
        run: lua5.1 tests/test_runtime.lua

      - name: Validate addon version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^## Version: *//p' NoQuestHintsForever/NoQuestHintsForever.toc | head -n 1 | tr -d '\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Invalid or missing addon version in TOC'
            exit 1
          fi
          release_version="$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v${version}(-(alpha|beta)(\.[0-9]+)?)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match TOC version v$version"
              exit 1
            fi
            release_version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "filename=NoQuestHintsForever-v$release_version.zip" >> "$GITHUB_OUTPUT"

      - name: Package installable addon
        shell: bash
        env:
          FILENAME: ${{ steps.version.outputs.filename }}
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -q -X "dist/$FILENAME" \
            NoQuestHintsForever/NoQuestHintsForever.toc \
            NoQuestHintsForever/NoQuestHintsForever.lua \
            NoQuestHintsForever/LICENSE
          python3 - "$FILENAME" <<'PY'
          import sys
          import zipfile

          filename = 'dist/' + sys.argv[1]
          expected = {
              'NoQuestHintsForever/NoQuestHintsForever.toc',
              'NoQuestHintsForever/NoQuestHintsForever.lua',
              'NoQuestHintsForever/LICENSE',
          }
          with zipfile.ZipFile(filename) as archive:
              actual = set(archive.namelist())
              if actual != expected or archive.testzip() is not None:
                  raise SystemExit(f'Invalid release ZIP contents: {actual}')
          print(f'Validated {filename}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: addon-${{ needs.build.outputs.version }}
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          prerelease: true  # Until the Forever client compatibility is verified.
